appId: vn.vidflow.app
productName: VidFlow
directories:
  output: release
files:
  - package.json
  - renderer/dist/**/*
  - dist-electron/**/*
  - '!profiles/**'
  - '!**/profiles/**'
  - '!test/**'
  - '!tests/**'
  - '!**/test/**'
  - '!**/tests/**'
  - '!**/*.test.*'
  - '!**/*.spec.*'
  - '!data/**'
  - '!userData/**'
  - '!**/data/**'
  - '!**/userData/**'
  - '!**/*.sqlite*'
  - '!**/*.db'
  - '!.env*'
  - '!**/.env*'
  - '!docs/**'
  - '!src/**'
win:
  target:
    - target: nsis
      arch:
        - x64
  # Rendered by config/generate-icon.py. Skip code signing but keep editing the exe so it gets the icon and metadata.
  icon: build/icon.ico
  signExecutable: false
forceCodeSigning: false
nsis:
  # One click installs everything for the current user (no admin prompt) and starts VidFlow.
  oneClick: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  # No spaces: the same name is the GitHub release file that config/update-manifest.mjs points updates at.
  artifactName: VidFlow-Setup-${version}.${ext}
publish: null
# Built by config/vendor-tools.mjs; resolved at runtime by src/app/bundled-tools.ts.
extraResources:
  - from: vendor/ffmpeg
    to: ffmpeg
  - from: vendor/ms-playwright
    to: ms-playwright
